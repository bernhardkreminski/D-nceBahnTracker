  <!-- Source artwork for the large icons (home screen, manifest). Full-bleed:
       iOS and Android apply their own mask, and an apple-touch-icon with alpha
       gets composited over black. The motif stays well inside the centre so
       neither mask can clip it. Small tab icons use favicon.svg instead, which
       drops the lights and wheels because they turn to mush at 16px. -->
