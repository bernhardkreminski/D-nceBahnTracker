name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The workflow's own GITHUB_TOKEN carries the Pages permission, so it can both
# enable and deploy the site without a personal access token.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site is plain static files -- upload the repository as-is.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
